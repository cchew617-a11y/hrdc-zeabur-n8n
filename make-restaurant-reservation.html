<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ... existing head content ... -->
</head>
<body class="bg-gray-50">

    <!-- ... existing body content ... -->

    <!-- Retell Web SDK - Corrected to directly expose 'Retell' global -->
    <script src="https://unpkg.com/@retell-ai/client-sdk"></script> 

    <!-- Your custom script for button interaction -->
    <script>
        // --- IMPORTANT: YOUR ACTUAL RETELL IDs ---
        const RETELL_PROJECT_ID = "org_KjCCCWCQL3V7Hqcp"; 
        const RETELL_AGENT_ID = "agent_a1ccb172ffb615eb075cdf828f";
        // ---------------------------------------------------

        const startCallButton = document.getElementById("startCallButton");
        const statusText = document.getElementById("status");
        let isCalling = false;
        
        // Initial checks for elements
        if (!startCallButton || !statusText) { 
            console.error("HTML elements with IDs 'startCallButton' or 'status' were not found in the DOM.");
            // If button is null, we can't add an onclick listener later, so exit gracefully
            // Status text can't be updated if it's null either.
        }

        // Function to start the conversation
        async function startConversation() {
            if (!RETELL_PROJECT_ID || !RETELL_AGENT_ID || 
                RETELL_PROJECT_ID === "YOUR_RETELL_PROJECT_ID" || RETELL_AGENT_ID === "YOUR_RETELL_AGENT_ID") {
                if (statusText) {
                    statusText.textContent = "Error: Retell Project ID or Agent ID not properly configured in the script.";
                    statusText.classList.add("error");
                }
                return;
            }

            if (statusText) {
                statusText.textContent = "Connecting to AI assistant...";
                statusText.classList.remove("error");
            }
            
            try {
                // --- CRUCIAL CHANGE: Use 'Retell' global, not 'window.retellSDK' ---
                if (typeof Retell === 'undefined' || !Retell.startConversation) {
                    throw new Error("Retell SDK (global 'Retell' object) is not available or not initialized. Check network/loading.");
                }

                await Retell.startConversation({ // Calling 'Retell.startConversation'
                    projectId: RETELL_PROJECT_ID,
                    agentId: RETELL_AGENT_ID,
                    audioWeb: true,
                    mic: true
                });
                isCalling = true;
                if (startCallButton) startCallButton.textContent = "End Reservation Call";
                if (statusText) statusText.textContent = "Connected! You can now speak to the AI.";
            } catch (error) {
                console.error("Error starting Retell conversation:", error);
                if (statusText) {
                    statusText.textContent = `Failed to connect: ${error.message || 'Unknown error'}. Please try again.`;
                    statusText.classList.add("error");
                }
                isCalling = false;
                if (startCallButton) startCallButton.textContent = "Start Reservation Call";
            }
        }

        // Function to stop the conversation
        function stopConversation() {
            // --- CRUCIAL CHANGE: Use 'Retell' global, not 'window.retellSDK' ---
            if (typeof Retell !== 'undefined' && Retell.stopConversation && isCalling) {
                Retell.stopConversation();
            }
            isCalling = false;
            if (startCallButton) startCallButton.textContent = "Start Reservation Call";
            if (statusText) {
                statusText.textContent = "Call ended.";
                statusText.classList.remove("error");
            }
        }

        // Event listener for the button
        if (startCallButton) { 
            startCallButton.onclick = async () => {
                if (isCalling) {
                    stopConversation();
                } else {
                    startConversation();
                }
            };
        }

        // Optional: Handle Retell SDK events for better UI feedback
        // --- CRUCIAL CHANGE: Use 'Retell' global, not 'window.retellSDK' ---
        // Check for Retell presence just before adding listeners
        if (typeof Retell !== 'undefined' && Retell.on) { 
            Retell.on("conversation_started", () => {
                console.log("Retell: Conversation started!");
                if (statusText) {
                    statusText.textContent = "Connected! You can now speak to the AI.";
                    statusText.classList.remove("error");
                }
            });

            Retell.on("conversation_ended", () => {
                console.log("Retell: Conversation ended!");
                stopConversation();
            });

            Retell.on("error", (error) => {
                console.error("Retell SDK event error:", error);
                if (statusText) {
                    statusText.textContent = `An error occurred during call: ${error.message || 'Unknown error'}. Please try again.`;
                    statusText.classList.add("error");
                }
                isCalling = false;
                if (startCallButton) startCallButton.textContent = "Start Reservation Call";
            });
        }

        // Add a check for microphone permissions (good practice)
        async function checkMicPermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop()); // Stop immediately
                console.log("Microphone access granted.");
            } catch (err) {
                console.warn("Microphone access denied or not granted yet.", err);
                if (statusText) {
                    statusText.textContent = "Please allow microphone access to use the voice assistant.";
                    statusText.classList.add("error");
                }
            }
        }
        // checkMicPermission(); 
    </script>
</body>
</html>
